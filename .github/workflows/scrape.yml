name: Refresh Ireland Job Radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ireland-job-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: Run Ireland job collector
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          ATS_PROBE_LIMIT: "100"
        run: python scrape.py

      - name: Commit generated state safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          tmpdir="$(mktemp -d)"
          for f in data.json seen_jobs.json ats_platform_cache.json sponsorship_history.json official_permit_stats.json; do
            [ -f "$f" ] && cp "$f" "$tmpdir/$f"
          done

          git fetch origin main
          git reset --hard origin/main

          for f in data.json seen_jobs.json ats_platform_cache.json sponsorship_history.json official_permit_stats.json; do
            if [ -f "$tmpdir/$f" ]; then
              cp "$tmpdir/$f" "$f"
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No generated-file changes"
            exit 0
          fi

          git commit -m "Refresh Ireland Job Radar $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi

            echo "Remote moved; rebuilding generated-state commit on latest main"
            for f in data.json seen_jobs.json ats_platform_cache.json sponsorship_history.json official_permit_stats.json; do
              [ -f "$f" ] && cp "$f" "$tmpdir/$f"
            done

            git fetch origin main
            git reset --hard origin/main

            for f in data.json seen_jobs.json ats_platform_cache.json sponsorship_history.json official_permit_stats.json; do
              if [ -f "$tmpdir/$f" ]; then
                cp "$tmpdir/$f" "$f"
                git add "$f"
              fi
            done

            git diff --staged --quiet && exit 0
            git commit -m "Refresh Ireland Job Radar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 5
          done

          exit 1
