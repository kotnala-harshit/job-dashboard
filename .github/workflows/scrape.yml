name: Refresh Ireland Job Radar

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: ireland-job-radar-refresh
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Run FULL FAST FAST refresh cycle
        shell: bash
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          ATS_PROBE_LIMIT: "100"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          START_EPOCH="$(date +%s)"
          MAX_CYCLE_SECONDS=3000

          GENERATED_FILES=(
            data.json
            seen_jobs.json
            job_state.json
            connector_cache.json
            ats_platform_cache.json
            browser_scrape_cache.json
            jsonld_cache.json
            sponsorship_history.json
            official_permit_stats.json
            graduate_programme_history.json
            last_full_refresh.json
          )

          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          commit_state() {
            local mode="$1"
            local tmpdir
            tmpdir="$(mktemp -d)"

            for f in "${GENERATED_FILES[@]}"; do
              [ -f "$f" ] && cp "$f" "$tmpdir/$f"
            done

            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main

              for f in "${GENERATED_FILES[@]}"; do
                if [ -f "$tmpdir/$f" ]; then
                  cp "$tmpdir/$f" "$f"
                  git add "$f"
                fi
              done

              if git diff --staged --quiet; then
                echo "No generated changes after $mode"
                rm -rf "$tmpdir"
                return 0
              fi

              git commit -m "Refresh Ireland Job Radar [$mode] $(date -u +%Y-%m-%dT%H:%M:%SZ)"

              if git push origin HEAD:main; then
                echo "Push succeeded after $mode"
                rm -rf "$tmpdir"
                return 0
              fi

              for f in "${GENERATED_FILES[@]}"; do
                [ -f "$f" ] && cp "$f" "$tmpdir/$f"
              done

              echo "Remote changed; retrying push..."
              sleep 4
            done

            echo "Push failed after $mode"
            rm -rf "$tmpdir"
            return 1
          }

          run_full() {
            echo
            echo "========================================"
            echo "FULL START $(date -u)"
            echo "========================================"

            local started
            started="$(date +%s)"

            if timeout --signal=TERM --kill-after=30s 35m env SCRAPE_MODE=full python scrape.py; then
              python -c 'import json,datetime; json.dump({"completed_at":datetime.datetime.now(datetime.timezone.utc).isoformat()},open("last_full_refresh.json","w"),indent=2)'
              commit_state "FULL"
              echo "FULL SUCCESS in $(( $(date +%s) - started ))s"
              return 0
            fi

            rc=$?
            echo "FULL FAILED/TIMED OUT rc=$rc after $(( $(date +%s) - started ))s"
            return "$rc"
          }

          run_fast() {
            echo
            echo "========================================"
            echo "FAST START $(date -u)"
            echo "========================================"

            local started
            started="$(date +%s)"

            if timeout --signal=TERM --kill-after=20s 10m env SCRAPE_MODE=fast python scrape.py; then
              commit_state "FAST"
              echo "FAST SUCCESS in $(( $(date +%s) - started ))s"
              return 0
            fi

            rc=$?
            echo "FAST FAILED/TIMED OUT rc=$rc after $(( $(date +%s) - started ))s"
            return "$rc"
          }

          cycle=1

          while true; do
            elapsed=$(( $(date +%s) - START_EPOCH ))

            if [ "$elapsed" -ge "$MAX_CYCLE_SECONDS" ]; then
              echo "Hourly refresh window complete"
              break
            fi

            echo
            echo "######## CYCLE $cycle ########"

            if ! run_full; then
              echo "FULL failed; skipping FAST runs and ending this hourly workflow"
              break
            fi

            elapsed=$(( $(date +%s) - START_EPOCH ))
            [ "$elapsed" -ge "$MAX_CYCLE_SECONDS" ] && break

            run_fast || echo "FAST #1 failed; continuing"

            elapsed=$(( $(date +%s) - START_EPOCH ))
            [ "$elapsed" -ge "$MAX_CYCLE_SECONDS" ] && break

            run_fast || echo "FAST #2 failed; continuing"

            cycle=$((cycle + 1))

            elapsed=$(( $(date +%s) - START_EPOCH ))

            if [ "$elapsed" -ge "$MAX_CYCLE_SECONDS" ]; then
              break
            fi
          done

          echo
          echo "Refresh workflow finished after $(( $(date +%s) - START_EPOCH )) seconds"

      - name: Final repository status
        if: always()
        run: |
          git status --short
          cat last_full_refresh.json 2>/dev/null || true
