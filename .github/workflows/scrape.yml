name: Refresh Ireland Job Radar

on:
  schedule:
    - cron: '03 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time. Scheduled runs wait rather than cancelling a scrape
# that is already publishing the dashboard.
concurrency:
  group: ireland-job-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi playwright
          python -m playwright install --with-deps chromium
      - name: Collect and publish core boards
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 11m env SCRAPE_MODE=full SCRAPE_PHASE=core SCRAPE_WORKERS=20 python -u scrape.py
          python -c 'import datetime,json; json.dump({"completed_at":datetime.datetime.now(datetime.timezone.utc).isoformat()},open("last_full_refresh.json","w"),indent=2)'
          git config user.name job-radar-bot
          git config user.email actions@users.noreply.github.com
          git add data.json seen_jobs.json company_history.json sponsorship_history.json last_full_refresh.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh Ireland Job Radar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin HEAD:main
