name: Refresh Ireland Job Radar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: ireland-job-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Run Ireland job collector
        env:
          SCRAPE_MODE: ${{ github.event_name == 'schedule' && 'fast' || 'full' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          ATS_PROBE_LIMIT: "100"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scrape.py

      - name: Commit generated state safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          tmpdir="$(mktemp -d)"
          GENERATED_FILES=(
            data.json
            seen_jobs.json
            job_state.json
            connector_cache.json
            ats_platform_cache.json
            browser_scrape_cache.json
            jsonld_cache.json
            sponsorship_history.json
            official_permit_stats.json
          )

          for f in "${GENERATED_FILES[@]}"; do
            [ -f "$f" ] && cp "$f" "$tmpdir/$f"
          done

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            for f in "${GENERATED_FILES[@]}"; do
              if [ -f "$tmpdir/$f" ]; then
                cp "$tmpdir/$f" "$f"
                git add "$f"
              fi
            done

            if git diff --staged --quiet; then
              echo "No generated-file changes"
              exit 0
            fi

            git commit -m "Refresh Ireland Job Radar $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            for f in "${GENERATED_FILES[@]}"; do
              [ -f "$f" ] && cp "$f" "$tmpdir/$f"
            done

            echo "Remote changed; retrying..."
            sleep 5
          done

          echo "All push attempts failed"
          exit 1
