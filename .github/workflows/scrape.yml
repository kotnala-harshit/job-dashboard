name: Refresh Ireland Job Radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ireland-job-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: Run broad collector + profile-aware ranker
        run: python scrape.py

      - name: Commit generated state
        shell: bash
        run: |
          set -e
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data.json seen_jobs.json ats_platform_cache.json
          [ -f sponsorship_history.json ] && git add sponsorship_history.json
          [ -f official_permit_stats.json ] && git add official_permit_stats.json

          if git diff --staged --quiet; then
            echo "No generated-file changes"
            exit 0
          fi

          git commit -m "Refresh Ireland Job Radar $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          exit 1
