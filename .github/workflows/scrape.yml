name: Scrape jobs

on:
  schedule:
    # Runs every hour, on the hour. This is the actual lever for "early
    # mover advantage" -- job aggregators (Adzuna/Careerjet/Jooble) crawl
    # the same primary ATS sources this scraper hits, just later, so they
    # don't make anything earlier, only broader. Going direct + running
    # often is what gets you there first. GitHub Actions minutes are
    # completely free and uncapped on PUBLIC repos (the 2,000 min/month
    # cap only applies to private repos), so hourly costs nothing --
    # dial down to e.g. "0 */3 * * *" (every 3 hours) if you'd rather be
    # gentler on the free ATS APIs themselves.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated data.json
        run: |
          git config user.name "job-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update job data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
