name: Refresh Ireland Job Radar

concurrency:
  group: ireland-job-radar-scrape
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '37 * * * *'
    - cron: '57 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh depth
        type: choice
        options:
          - fast
          - full
        default: fast

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 85

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Run one bounded refresh
        shell: bash
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          ATS_PROBE_LIMIT: "100"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          GENERATED_FILES=(
            data.json
            seen_jobs.json
            job_state.json
            connector_cache.json
            ats_platform_cache.json
            browser_scrape_cache.json
            jsonld_cache.json
            sponsorship_history.json
            graduate_programme_history.json
            last_full_refresh.json
          )

          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          commit_state() {
            local mode="$1"
            local tmpdir
            tmpdir="$(mktemp -d)"

            for f in "${GENERATED_FILES[@]}"; do
              [ -f "$f" ] && cp "$f" "$tmpdir/$f"
            done

            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main

              for f in "${GENERATED_FILES[@]}"; do
                if [ -f "$tmpdir/$f" ]; then
                  cp "$tmpdir/$f" "$f"
                  git add "$f"
                fi
              done

              if git diff --staged --quiet; then
                echo "No generated changes after $mode"
                rm -rf "$tmpdir"
                return 0
              fi

              git commit -m "Refresh Ireland Job Radar [$mode] $(date -u +%Y-%m-%dT%H:%M:%SZ)"

              if git push origin HEAD:main; then
                echo "Push succeeded after $mode"
                rm -rf "$tmpdir"
                return 0
              fi

              for f in "${GENERATED_FILES[@]}"; do
                [ -f "$f" ] && cp "$f" "$tmpdir/$f"
              done

              echo "Remote changed; retrying push..."
              sleep 4
            done

            echo "Push failed after $mode"
            rm -rf "$tmpdir"
            return 1
          }

          mode=fast
          if [ "${{ github.event_name }}" = "schedule" ]; then
            minute="$(date -u +%M)"
            if [ "$minute" = "17" ]; then
              mode=full
            else
              mode=fast
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          fi

          echo "Selected refresh mode: $mode"

          started="$(date +%s)"
          limit=12m
          [ "$mode" = full ] && limit=75m

          timeout --signal=TERM --kill-after=30s "$limit" env SCRAPE_MODE="$mode" python scrape.py
          if [ "$mode" = full ]; then
            python -c 'import json,datetime; json.dump({"completed_at":datetime.datetime.now(datetime.timezone.utc).isoformat()},open("last_full_refresh.json","w"),indent=2)'
          fi
          commit_state "${mode^^}"
          echo "${mode^^} SUCCESS in $(( $(date +%s) - started ))s"

      - name: Final repository status
        if: always()
        run: |
          git status --short
          cat last_full_refresh.json 2>/dev/null || true
