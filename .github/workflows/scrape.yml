name: Refresh Ireland Job Radar

on:
  schedule:
    # GitHub can delay or drop scheduled events. Four off-peak triggers give
    # the stale-data check several chances each hour without extra scrapes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time. Queued scheduler events re-check freshness after the
# active refresh finishes and exit cheaply when no work is due.
concurrency:
  group: ireland-job-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Decide whether this trigger needs a refresh
        id: refresh_due
        shell: bash
        run: |
          set -euo pipefail

          # Manual dispatches always run. Scheduled triggers run only when
          # the last completed refresh is sufficiently old.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run only if the last completed/published refresh is at least
          # 55 minutes old or unreadable.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          from pathlib import Path

          due = True
          path = Path("last_full_refresh.json")
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
              raw = payload["completed_at"]
              completed = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if completed.tzinfo is None:
                  completed = completed.replace(tzinfo=dt.timezone.utc)
              age = dt.datetime.now(dt.timezone.utc) - completed.astimezone(dt.timezone.utc)
              due = age >= dt.timedelta(minutes=55)
          except Exception:
              due = True

          print(f"run={'true' if due else 'false'}")
          PY

      - uses: actions/setup-python@v6
        if: steps.refresh_due.outputs.run == 'true'
        with: {python-version: '3.11'}

      - name: Install dependencies
        if: steps.refresh_due.outputs.run == 'true'
        run: |
          pip install requests beautifulsoup4 curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Collect and publish core boards and proven batches
        if: steps.refresh_due.outputs.run == 'true'
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          timeout --signal=TERM --kill-after=30s 45m env SCRAPE_MODE=full SCRAPE_PHASE=core SCRAPE_WORKERS=20 python -u scrape.py
          python -c 'import datetime,json; json.dump({"completed_at":datetime.datetime.now(datetime.timezone.utc).isoformat()},open("last_full_refresh.json","w"),indent=2)'
          python health_check.py
          git config user.name job-radar-bot
          git config user.email actions@users.noreply.github.com
          git add data.json seen_jobs.json company_history.json last_full_refresh.json graduate_programme_history.json ats_platform_cache.json jsonld_cache.json browser_scrape_cache.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh Ireland Job Radar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A dashboard edit can land while a long refresh is collecting. Keep
          # the fresh generated outputs if they conflict, while rebasing code.
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
