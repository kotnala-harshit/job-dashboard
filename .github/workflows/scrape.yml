name: Refresh Ireland Job Radar

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - full

      target_companies:
        description: "FAST mode only: comma-separated company names, e.g. Accenture,Citi,KPMG Ireland"
        required: false
        default: ""
        type: string

      publish_results:
        description: "Commit generated files to main after this manual run?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ireland-job-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: Resolve run mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "SCRAPE_MODE=full" >> "$GITHUB_ENV"
            echo "TARGET_COMPANIES=" >> "$GITHUB_ENV"
            echo "ATS_PROBE_LIMIT=100" >> "$GITHUB_ENV"
            echo "PUBLISH_RESULTS=true" >> "$GITHUB_ENV"
          else
            MODE="${{ inputs.mode }}"
            TARGETS="${{ inputs.target_companies }}"
            PUBLISH="${{ inputs.publish_results }}"

            echo "SCRAPE_MODE=$MODE" >> "$GITHUB_ENV"
            echo "TARGET_COMPANIES=$TARGETS" >> "$GITHUB_ENV"
            echo "PUBLISH_RESULTS=$PUBLISH" >> "$GITHUB_ENV"

            if [[ "$MODE" == "fast" ]]; then
              # FAST mode is intended for targeted connector testing.
              # Keep discovery bounded so one-company tests stay quick.
              echo "ATS_PROBE_LIMIT=10" >> "$GITHUB_ENV"

              if [[ -z "${TARGETS// }" ]]; then
                echo "::warning::FAST mode was selected with no target companies. The scraper will use its own FAST-mode fallback behavior."
              fi
            else
              echo "ATS_PROBE_LIMIT=100" >> "$GITHUB_ENV"
            fi
          fi

      - name: Show run configuration
        shell: bash
        run: |
          echo "Mode:              $SCRAPE_MODE"
          echo "Target companies:  ${TARGET_COMPANIES:-<none>}"
          echo "ATS probe limit:   $ATS_PROBE_LIMIT"
          echo "Publish results:   $PUBLISH_RESULTS"

      - name: Run Ireland job collector
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          SCRAPE_MODE: ${{ env.SCRAPE_MODE }}
          TARGET_COMPANIES: ${{ env.TARGET_COMPANIES }}
          ATS_PROBE_LIMIT: ${{ env.ATS_PROBE_LIMIT }}
        run: python scrape.py

      - name: Show generated changes
        shell: bash
        run: |
          echo "Generated file changes:"
          git status --short
          echo
          git diff --stat || true

      - name: Skip publishing FAST test
        if: env.PUBLISH_RESULTS != 'true'
        run: |
          echo "This was a test-only run."
          echo "Generated changes were intentionally NOT committed to main."
          echo "When the connector looks correct, run FULL or rerun with Publish results enabled."

      - name: Commit generated state safely
        if: env.PUBLISH_RESULTS == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          tmpdir="$(mktemp -d)"

          for f in \
            data.json \
            seen_jobs.json \
            job_state.json \
            connector_cache.json \
            ats_platform_cache.json \
            sponsorship_history.json \
            official_permit_stats.json
          do
            [ -f "$f" ] && cp "$f" "$tmpdir/$f"
          done

          git fetch origin main
          git reset --hard origin/main

          for f in \
            data.json \
            seen_jobs.json \
            job_state.json \
            connector_cache.json \
            ats_platform_cache.json \
            sponsorship_history.json \
            official_permit_stats.json
          do
            if [ -f "$tmpdir/$f" ]; then
              cp "$tmpdir/$f" "$f"
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No generated-file changes"
            exit 0
          fi

          git commit -m "Refresh Ireland Job Radar $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi

            echo "Remote moved; rebuilding generated-state commit on latest main"

            for f in \
              data.json \
              seen_jobs.json \
              job_state.json \
              connector_cache.json \
              ats_platform_cache.json \
              sponsorship_history.json \
              official_permit_stats.json
            do
              [ -f "$f" ] && cp "$f" "$tmpdir/$f"
            done

            git fetch origin main
            git reset --hard origin/main

            for f in \
              data.json \
              seen_jobs.json \
              job_state.json \
              connector_cache.json \
              ats_platform_cache.json \
              sponsorship_history.json \
              official_permit_stats.json
            do
              if [ -f "$tmpdir/$f" ]; then
                cp "$tmpdir/$f" "$f"
                git add "$f"
              fi
            done

            git diff --staged --quiet && exit 0
            git commit -m "Refresh Ireland Job Radar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 5
          done

          echo "All push attempts failed"
          exit 1
