<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harshit's Job Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
  }
  .controls input, .controls select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  .controls input { flex: 1; min-width: 200px; }
  .stats { padding: 8px 32px; color: var(--muted); font-size: 12px; }
  #jobs {
    padding: 16px 32px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .job {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .job h3 { margin: 0 0 6px; font-size: 15px; line-height: 1.35; }
  .job a { color: var(--text); text-decoration: none; }
  .job a:hover { color: var(--accent); }
  .job .company { color: var(--accent); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .job .meta { margin-top: 8px; color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    background: #22262f;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
  }
  .empty { padding: 60px 32px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Harshit's Job Dashboard</h1>
  <p id="updated">Loading...</p>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Search title, company, location..." />
  <select id="atsFilter">
    <option value="">All sources</option>
    <option value="greenhouse">Greenhouse</option>
    <option value="lever">Lever</option>
    <option value="ashby">Ashby</option>
  </select>
  <select id="recencyFilter">
    <option value="">Any time posted</option>
    <option value="24h">Last 24 hours</option>
    <option value="7d">Last 7 days</option>
    <option value="30d">Last 30 days</option>
  </select>
  <select id="typeFilter">
    <option value="">All employment types</option>
    <option value="full_time">Full-time</option>
    <option value="part_time">Part-time</option>
    <option value="internship">Internship</option>
  </select>
  <select id="sortBy">
    <option value="date">Newest first</option>
    <option value="company">Company A-Z</option>
    <option value="title">Title A-Z</option>
  </select>
</div>

<div class="stats" id="stats"></div>
<div id="jobs"></div>

<script>
let allJobs = [];

fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allJobs = data.jobs || [];
    document.getElementById('updated').textContent =
      `Last updated: ${new Date(data.generated_at).toLocaleString()} · ${data.total_companies_checked} companies checked · ${data.total_matches} matches`;
    render();
  })
  .catch(err => {
    document.getElementById('jobs').innerHTML =
      '<div class="empty">Could not load data.json yet. Run the GitHub Action once, then refresh.</div>';
    console.error(err);
  });

// Mirrors scrape.py's parse_posted_date() -- recomputed live in JS (rather
// than trusting the server-side "recency" tag) so the bucket is accurate as
// of the moment you're viewing the dashboard, not as of whenever the last
// scrape ran. Handles ISO8601 (most ATSs) and Workday's relative strings
// ("Posted Today", "Posted 3 Days Ago", "Posted 30+ Days Ago").
function parsePostedDate(value) {
  if (!value) return null;
  const s = String(value).trim();

  const iso = new Date(s);
  if (!isNaN(iso.getTime())) return iso;

  const sl = s.toLowerCase();
  const now = new Date();
  if (sl.includes('today')) return now;
  if (sl.includes('yesterday')) return new Date(now - 24 * 3600 * 1000);
  const m = sl.match(/(\d+)\+?\s*day/);
  if (m) return new Date(now - parseInt(m[1], 10) * 24 * 3600 * 1000);
  return null;
}

// Mirrors scrape.py's employment_type() so filtering works even against an
// older data.json that predates this field being written server-side.
const INTERNSHIP_KEYWORDS = ['intern', 'internship', 'working student', 'student job', 'placement', 'co-op', 'co op'];
const PART_TIME_KEYWORDS = ['part time', 'part-time', 'seasonal', 'temporary staff', 'christmas temp', 'weekend staff'];

function employmentType(title) {
  const t = (title || '').toLowerCase();
  if (INTERNSHIP_KEYWORDS.some(k => t.includes(k))) return 'internship';
  if (PART_TIME_KEYWORDS.some(k => t.includes(k))) return 'part_time';
  return 'full_time';
}

function recencyBucket(date) {
  if (!date) return 'unknown';
  const ageMs = Date.now() - date.getTime();
  const hour = 3600 * 1000, day = 24 * hour;
  if (ageMs <= 24 * hour) return '24h';
  if (ageMs <= 7 * day) return '7d';
  if (ageMs <= 30 * day) return '30d';
  return 'older';
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const ats = document.getElementById('atsFilter').value;
  const recency = document.getElementById('recencyFilter').value;
  const empType = document.getElementById('typeFilter').value;
  const sortBy = document.getElementById('sortBy').value;
  const recencyRank = { '24h': 0, '7d': 1, '30d': 2, 'older': 3, 'unknown': 4 };

  let jobs = allJobs.filter(j => {
    const haystack = `${j.title} ${j.company} ${j.location}`.toLowerCase();
    const matchesQuery = !q || haystack.includes(q);
    const matchesAts = !ats || j.ats === ats;
    let matchesRecency = true;
    if (recency) {
      const bucket = recencyBucket(parsePostedDate(j.updated_at));
      matchesRecency = recencyRank[bucket] <= recencyRank[recency];
    }
    const matchesType = !empType || (j.employment_type || employmentType(j.title)) === empType;
    return matchesQuery && matchesAts && matchesRecency && matchesType;
  });

  jobs.sort((a, b) => {
    if (sortBy === 'company') return (a.company || '').localeCompare(b.company || '');
    if (sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
    return new Date(b.updated_at || 0) - new Date(a.updated_at || 0);
  });

  document.getElementById('stats').textContent = `Showing ${jobs.length} of ${allJobs.length} jobs`;

  const container = document.getElementById('jobs');
  if (jobs.length === 0) {
    container.innerHTML = '<div class="empty">No jobs match your filters.</div>';
    return;
  }

  container.innerHTML = jobs.map(j => {
    const postedDate = parsePostedDate(j.updated_at);
    const bucket = recencyBucket(postedDate);
    const bucketLabel = { '24h': 'Posted today', '7d': 'This week', '30d': 'This month', 'older': 'Older', 'unknown': '' }[bucket];
    const type = j.employment_type || employmentType(j.title);
    const typeLabel = { 'part_time': 'Part-time', 'internship': 'Internship' }[type];
    return `
    <div class="job">
      <div class="company">${escapeHtml(j.company)}</div>
      <h3><a href="${j.url}" target="_blank" rel="noopener">${escapeHtml(j.title)}</a></h3>
      <div class="meta">
        <span class="badge">${escapeHtml(j.location || 'Unknown location')}</span>
        <span class="badge">${escapeHtml(j.ats)}</span>
        ${postedDate ? `<span class="badge">${postedDate.toLocaleDateString()}</span>` : ''}
        ${bucketLabel ? `<span class="badge" style="border-color:var(--accent);color:var(--accent);">${bucketLabel}</span>` : ''}
        ${typeLabel ? `<span class="badge" style="border-color:#e0a83c;color:#e0a83c;">${typeLabel}</span>` : ''}
      </div>
    </div>
  `;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('atsFilter').addEventListener('change', render);
document.getElementById('recencyFilter').addEventListener('change', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);
</script>

</body>
</html>
